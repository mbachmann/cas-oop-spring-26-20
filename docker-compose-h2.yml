
services:

  demo-initial-h2:
    image: uportal/demo-initial:latest
    container_name: demo-initial-on-h2
    restart: unless-stopped
    environment:
      APP_NAME: Demo Initial with H2
      APP_URL: http://localhost:8080
      ACTIVE_PROFILES: dev,h2
      CORS_ALLOWED_ORIGINS: https://demo-initial-h2.example.com,http://localhost:4200,http://localhost:4000,http://localhost:4001,http://localhost:8080
    ports:
      - 8080:8080
