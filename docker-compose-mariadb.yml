

services:
  demo-initial-mariadb:
    image: uportal/demo-initial:latest
    container_name: demo-initial-mariadb
    restart: unless-stopped
    environment:
      APP_NAME: Demo Initial with MariaDB 11
      ACTIVE_PROFILES: dev,mariadb
      APP_URL: http://localhost:8080
      APP_DB_HOST: demo-initial-mariadb11-db
      APP_DB_PORT: 3306
      APP_DB_NAME: db
      APP_DB_USERNAME: root
      APP_DB_PASSWORD: demo-initial
      LOKI_URL: http://localhost:3100/loki/api/v1/push
      LOKI_ENABLED: false
    ports:
      - 8080:8080
    depends_on:
      demo-initial-dbmariadb11:
        condition: service_healthy

  demo-initial-adminer-mariadb11:
    image: adminer:4.17.1
    container_name: demo-initial-adminer-on-mariadb11
    restart: unless-stopped
    ports:
      - 9090:8080
    environment:
      ADMINER_DEFAULT_SERVER: demo-initial-mariadb11-db
    depends_on:
      demo-initial-dbmariadb11:
        condition: service_healthy

  demo-initial-dbmariadb11:
    platform: linux/amd64
    image: mariadb:11.7.2-ubi
    container_name: demo-initial-mariadb11-db
    # command: /usr/sbin/mariadbd --mysql-native-password=ON
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: 'db'
      # So you don't have to use root, but you can if you like
      MARIADB_USER: 'user'
      # You can use whatever password you like
      MARIADB_PASSWORD: 'demo-initial'
      # Password for root access
      MARIADB_ROOT_PASSWORD: 'demo-initial'
    ports:
      # <Port exposed> : < MySQL Port running inside container>, host port for using with mysql-workbench or dbeaver
      - '33067:3306'
    expose:
      # Opens port 3306 on the container
      - '3306'
      # Where our data will be persisted
    volumes:
      - mariadb11-demo-initialdb:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
# Names our volume
volumes:
  mariadb11-demo-initialdb:
