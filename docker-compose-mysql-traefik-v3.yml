
networks:
  proxy:
    external: true
  internal:
    external: false
services:

  demo-initial-mysql:
    image: uportal/demo-initial-app:latest
    container_name: demo-initial-mysql
    restart: unless-stopped
    environment:
      APP_NAME: Demo Initial with MySQL and Traefik
      ACTIVE_PROFILES: dev,mysql
      APP_URL: https://demo-initial-on-mysql.example.com # change hostname!
      APP_DB_HOST: demo-initial-mysql84-db
      APP_DB_PORT: 3306
      APP_DB_NAME: demo-initial
      APP_DB_USERNAME: root
      APP_DB_PASSWORD: demo-initial
      LOKI_URL: http://localhost:3100/loki/api/v1/push
      LOKI_ENABLED: false
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.demo-initial-on-mysql.rule=Host(`demo-initial-on-mysql.example.com`)" # change hostname!
      - "traefik.http.routers.demo-initial-on-mysql.tls=true"
      - "traefik.http.routers.demo-initial-on-mysql.tls.certresolver=lets-encrypt"
      - "traefik.http.routers.demo-initial-on-mysql.entrypoints=websecure"
      - "traefik.http.services.demo-initial-on-mysql.loadbalancer.server.port=8080"
    depends_on:
      demo-initial-dbmysql84:
        condition: service_healthy

  demo-initial-adminer:
    image: adminer:4.17.1
    container_name: demo-initial-adminer-on-mysql
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: demo-initial-mysql84-db
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.demo-initial-adminer-mysql.rule=Host(`demo-initial-adminer-mysql.example.com`)" # change hostname!
      - "traefik.http.routers.demo-initial-adminer-mysql.tls=true"
      - "traefik.http.routers.demo-initial-adminer-mysql.tls.certresolver=lets-encrypt"
      - "traefik.http.routers.demo-initial-adminer-mysql.entrypoints=websecure"
      - "traefik.http.services.demo-initial-adminer-mysql.loadbalancer.server.port=8080"
    depends_on:
      demo-initial-dbmysql84:
        condition: service_healthy

  demo-initial-dbmysql84:
    image: mysql:8.4.4
    command: mysqld --mysql-native-password=ON
    container_name: demo-initial-mysql84-db
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    environment:
      MYSQL_DATABASE: 'demo-initial'
      # So you don't have to use root, but you can if you like
      MYSQL_USER: 'user'
      # You can use whatever password you like
      MYSQL_PASSWORD: 'demo-initial'
      # Password for root access
      MYSQL_ROOT_PASSWORD: 'demo-initial'
    ports:
      # <Port exposed> : < MySQL Port running inside container>, host port for using with mysql-workbench or dbeaver
      - '33066:3306'
    expose:
      # Opens port 3306 on the container
      - '3306'
      # Where our data will be persisted
    volumes:
      - demo-initial-mysql84-vol:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 10s
      retries: 20
# Names our volume
volumes:
  demo-initial-mysql84-vol:
