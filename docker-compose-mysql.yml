
services:
  adminer:
    image: adminer:4.17.1
    container_name: adminer-on-mysql
    restart: unless-stopped
    ports:
      - 9090:8080
    environment:
      ADMINER_DEFAULT_SERVER: mysql84-db
    depends_on:
      dbmysql84:
        condition: service_healthy

  dbmysql84:
    image: mysql:8.4.4
    container_name: mysql84-db
    command: mysqld --mysql-native-password=ON
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: 'db'
      # So you don't have to use root, but you can if you like
      MYSQL_USER: 'user'
      # You can use whatever password you like
      MYSQL_PASSWORD: 'teko'
      # Password for root access
      MYSQL_ROOT_PASSWORD: 'teko'
    ports:
      - '3306:3306'
    expose:
      # Opens port 3306 on the container
      - '3306'
      # Where our data will be persisted
    volumes:
      - dbmysql84:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 10s
      retries: 20
# Names our volume
volumes:
  dbmysql84:
